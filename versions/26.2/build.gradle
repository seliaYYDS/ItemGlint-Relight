plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version

def toolchainProperties = new Properties()
file("toolchain.properties").withInputStream { toolchainProperties.load(it) }
def javaRelease = toolchainProperties.getProperty("java_release", "25").toInteger()

base { archivesName = project.archives_base_name }

repositories {
    maven { url = "https://repo.huaweicloud.com/repository/maven/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

loom {
    // Use a standard client source set in this no-remap target.
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            name = "26.2 Client"
            runDir = "run"
        }
    }
}

// Compile the minimal client entrypoint while shared APIs are ported.
sourceSets {
    main {
        java.srcDir("src/client/java")
        resources.srcDir("src/client/resources")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Unobfuscated 26.2 has no remap configurations, so regular scopes are used.
    // The loader must be on the runtime classpath: it provides the Knot launch classes.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Development-environment only: ModMenu is not a dependency of this mod and is
    // never published. localRuntime keeps it on the runClient classpath alone.
    localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    // Reuse the shared mod icon without copying the binary or pulling in the
    // common fabric.mod.json, which would collide with this module's metadata.
    from("../../common/src/main/resources/assets/itemglintrelight/icon.png") {
        into "assets/itemglintrelight"
    }

    inputs.properties([
        version: project.version, mod_id: project.mod_id, mod_name: project.mod_name,
        mod_description: project.mod_description, mod_author: project.mod_author,
        mod_license: project.mod_license, loader_version: project.loader_version,
        minecraft_version: project.minecraft_version
    ])
    filesMatching("fabric.mod.json") { expand(inputs.properties) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease
    options.encoding = "UTF-8"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaRelease) }
    withSourcesJar()
}

jar {
    from(file("../../LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
