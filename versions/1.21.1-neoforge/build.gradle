plugins {
    id "java-library"
    id "net.neoforged.moddev" version "${moddev_version}"
    id "maven-publish"
}

version = project.mod_version
def toolchainProperties = new Properties()
file("toolchain.properties").withInputStream { toolchainProperties.load(it) }
def javaRelease = toolchainProperties.getProperty("java_release", "21").toInteger()

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java {
            srcDir "src/client/java"
            // 共享配置模型、UI 控件与配置界面基类（与 1.21.1 Fabric 版本共用同一份源码）。
            srcDir "../../shared/config/java"
            // 1.21.1 只有 ResourceLocation，没有 Identifier；该平台实现由本模块提供。
            exclude "celia/adwadg/itemglintrelight/config/platform/IdentifierConfigPlatform.java"
            srcDir "../../shared/config/ui/java"
            srcDir "../../shared/config/client/java"
        }
        // 版本专属客户端资源目录（core shader 等）。
        resources {
            srcDir "src/client/resources"
        }
    }
}

processResources {
    // 复用仓库共享资源：lang、图标、内置字体；排除 Fabric 元数据与 1.21.11 专用着色器目录。
    from("../../common/src/main/resources") {
        exclude "fabric.mod.json"
        exclude "itemglintrelight.client.mixins.json"
        exclude "assets/itemglintrelight/shaders/**"
    }
    inputs.properties([
            version           : project.version,
            mod_id            : project.mod_id,
            mod_name          : project.mod_name,
            mod_description   : project.mod_description,
            mod_author        : project.mod_author,
            mod_license       : project.mod_license,
            minecraft_version : project.minecraft_version,
            neoforge_version  : project.neoforge_version
    ])
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xmaxerrs" << "100000"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
    withSourcesJar()
}

jar {
    from(file("../../LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}